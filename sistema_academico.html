<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Académico</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e2a38;
            color: white;
            text-align: center;
        }

        .header {
            margin-top: 40px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 17px;
            color: #cbd5e1;
        }

        .card {
            background: #f8fafc;
            color: #1e293b;
            width: 440px;
            margin: 50px auto;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0px 12px 30px rgba(0,0,0,0.35);
        }

        .logo {
            width: 95px;
            height: 95px;
            background: #22c55e;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: white;
            font-weight: bold;
        }

        .title {
            font-size: 30px;
            font-weight: bold;
            margin: 10px 0;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 25px;
            color: #475569;
        }

        .btn {
            display: block;
            background: #0ea5e9;
            color: white;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0284c7;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>UNIVERSIDAD AUTÓNOMA "TOMÁS FRÍAS"</h1>
        <p>Carrera de Ingeniería de Sistemas</p>
    </div>

    <div class="card">
        <div class="logo">IS</div>

        <div class="title">SISTEMA ACADÉMICO</div>
        <div class="subtitle">Gestión 2026</div>

        <a href="#" class="btn">Luis Grabiel Callapa</a>
        <a href="#" class="btn">⚙ Panel Proyecto X</a>
    </div>

    <div class="footer">
        © 2026 Ingeniería de Sistemas - UATF
    </div>

</body>
</html>
