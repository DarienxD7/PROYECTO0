<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Groups</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-container">
        <div class="system-bar">
            <span>GRUPOS CONTABLES</span>
        </div>

        <div class="unit-info">
            <strong>UNIDAD:</strong> 0252 &nbsp;&nbsp;&nbsp; Nivel Central
        </div>

        <div class="main-form">
            <h2 class="form-title">GRUPO CONTABLE</h2>

            <div class="grid-layout">
                <div class="field-row">
                    <label class="field-label">Grupo</label>
                    <input type="text" value="2" class="input-small">
                </div>
                <div class="field-row">
                    <label class="field-label">Nombre</label>
                    <select class="input-large">
                        <option>MUEBLES Y ENSERES DE OFICINA</option>
                    </select>
                </div>
                <div class="field-row">
                    <label class="field-label">Vida Útil</label>
                    <input type="text" value="10" class="input-small">
                </div>
                <div class="field-row">
                    <label class="field-label">Observaciones</label>
                    <textarea class="textarea-field"></textarea>
                </div>
            </div>

            <div class="checkbox-area">
                <label><input type="checkbox" checked> Deprecia</label>
            </div>

            <div class="data-table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 30%;">CÓDIGO</th>
                            <th style="width: 70%;">NOMBRE AUXILIAR</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>1</td><td>ACONDICIONADOR DE AIRE</td></tr>
                        <tr><td>2</td><td>ALACENA</td></tr>
                        <tr><td>3</td><td>ALFOMBRA O TAPIZ</td></tr>
                        <tr><td>4</td><td>AMPLIADORA DE FOTOGRAFÍA</td></tr>
                        <tr><td>6</td><td>ARMARIO</td></tr>
                        <tr><td>7</td><td>ASPIRADORA</td></tr>
                        <tr><td>8</td><td>ATRIL</td></tr>
                        <tr><td>9</td><td>BALANZA</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="action-footer">
            <button class="action-btn">Nuevo</button>
            <button class="action-btn">Modificar</button>
            <button class="action-btn btn-disabled">Guardar</button>
            <button class="action-btn">Eliminar</button>
            <button class="action-btn btn-disabled">Deshacer</button>
            <button class="action-btn">Salir</button>
        </div>
    </div>

</body>
</html>
